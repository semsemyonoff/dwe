version: 2

project_name: dwe

# Hooks run once before all builds. Order matters:
#   1. sync embedded docs (without it cmd/dwe does not compile)
#   2. regen the docs content-hash table (cheap; keeps the binary's manifest
#      consistent with the embedded tree)
#   3. cross-compile the bridge shims into the shimassets embed tree, so the
#      release binaries carry real shim payloads (the committed bin/.gitkeep
#      only guarantees the //go:embed pattern compiles)
#   4. generate shell completions via `go run ./cmd/dwe completion <shell>`,
#      so the resulting files reflect the exact cobra tree of this commit.
before:
  hooks:
    - ./scripts/sync-embedded-docs.sh
    - ./scripts/gen-docs-content-hashes.sh
    - ./scripts/build-shims.sh
    - ./scripts/gen-completions.sh

builds:
  - id: dwe
    main: ./cmd/dwe
    binary: dwe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/semsemyonoff/dwe/internal/shared/version.Version={{ .Version }}
      - -X github.com/semsemyonoff/dwe/internal/shared/version.Commit={{ .Commit }}
      - -X github.com/semsemyonoff/dwe/internal/shared/version.Date={{ .Date }}
      - -X github.com/semsemyonoff/dwe/internal/shared/version.BuiltBy=goreleaser

archives:
  - id: default
    ids:
      - dwe
    # Naming kept Homebrew-friendly: macos_x86_64 / macos_arm64 / linux_x86_64 /
    # linux_arm64. The Homebrew formula consumes the same tar.gz files as
    # general users.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - AGENTS.md
      - completions/dwe.bash
      - completions/dwe.zsh
      - completions/dwe.fish

nfpms:
  - id: packages
    ids:
      - dwe
    package_name: dwe
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: Semsemyonoff
    homepage: https://github.com/semsemyonoff/dwe
    maintainer: Semsemyonoff <semyonoff.sergey.usa@gmail.com>
    description: |-
      Docker-based developer environment manager.
      DWE (Dev Workspace Engine) orchestrates Docker services, deploy pipelines, and project
      commands from a single declarative configuration.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    # Completion files are placed at the canonical system paths so that
    # bash-completion, zsh's fpath, and fish's vendor_completions.d pick them
    # up automatically on package install. No post-install scripts required.
    contents:
      - src: completions/dwe.bash
        dst: /usr/share/bash-completion/completions/dwe
        file_info:
          mode: 0644
      - src: completions/dwe.zsh
        dst: /usr/share/zsh/site-functions/_dwe
        file_info:
          mode: 0644
      - src: completions/dwe.fish
        dst: /usr/share/fish/vendor_completions.d/dwe.fish
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/dwe/LICENSE
        file_info:
          mode: 0644

homebrew_casks:
  - name: dwe
    binaries:
      - dwe
    ids:
      - default
    repository:
      owner: semsemyonoff
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: https://github.com/semsemyonoff/dwe
    description: Docker-based developer environment manager
    license: MIT
    # The cask manifest auto-installs these into Homebrew's completion dirs;
    # brew picks them up via its standard fpath wiring for both Intel and
    # Apple Silicon installs.
    completions:
      bash: completions/dwe.bash
      zsh: completions/dwe.zsh
      fish: completions/dwe.fish
    # Strip the macOS quarantine attribute on install so the unsigned binary
    # runs without a Gatekeeper prompt. Standard pattern for unsigned CLI casks.
    # Guarded by OS.mac? — Linuxbrew does not ship /usr/bin/xattr and has no
    # Gatekeeper, so the hook is a no-op (and would crash) on Linux.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dwe"]
          end

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

# Release notes come from CHANGELOG.md, not from commit subjects: the release
# workflow extracts the tagged version's section and passes it via
# `--release-notes`. Leaving auto-generation on would append a second,
# differently-worded account of the same changes below the curated one.
changelog:
  disable: true

release:
  github:
    owner: semsemyonoff
    name: dwe
  draft: false
  prerelease: auto
