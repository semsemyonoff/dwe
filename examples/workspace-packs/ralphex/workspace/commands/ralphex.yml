group:
  title: Ralphex
  description: Prepare workspace prompts and per-plan repository scope
commands:
  scope:
    type: shell
    description: |
      Configure and validate the repository scope for a ralphex plan
      Pass repos as whitespace-separated workspace-relative paths (use . for root only).
      The base must exist in the root and every scoped checkout, and each scoped
      checkout must be on the task branch (the root may stay on ralphex's default_branch).
      --set prepare=true first tags a missing base at HEAD and switches to the task
      branch, creating it from the base. --set plan=<path> completes the printed
      ralphex launch command.
    cmd: sh workspace/scripts/ralphex-scope.sh
    params:
      repos:
        type: string
        required: true
      base:
        type: string
        required: true
      branch:
        type: string
        required: true
      prepare:
        type: bool
        default: false
      plan:
        type: string
    env:
      RALPHEX_REPOS: '${param.repos}'
      RALPHEX_BASE: '${param.base}'
      RALPHEX_BRANCH: '${param.branch}'
      RALPHEX_PREPARE: '${param.prepare}'
      RALPHEX_PLAN: '${param.plan}'
  prompts:
    type: shell
    description: |
      Regenerate the ten workspace prompt and agent overrides from ralphex defaults
      Use --set check=true to compare without writing; differences exit non-zero.
    cmd: sh workspace/scripts/ralphex-prompts.sh
    params:
      check:
        type: bool
        default: false
    env:
      RALPHEX_CHECK: '${param.check}'
