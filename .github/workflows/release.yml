name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # For the docs-site refresh below: `gh workflow run` is an Actions API write.
  actions: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history to resolve the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      # Fails the release when CHANGELOG.md carries no section for the tag being
      # pushed. That failure is the gate: without it, keep-a-changelog discipline
      # lasts until the first pull request that forgets an entry.
      - name: Extract release notes from CHANGELOG.md
        run: scripts/changelog-release-notes.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          # Default token — uploads release assets to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope for semsemyonoff/homebrew-tap so GoReleaser
          # can push the generated Casks/dwe.rb on each release. Configure
          # in repo Settings → Secrets → Actions.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # v0.6.0 published with an empty body: `.goreleaser.yaml` carried
      # `changelog.disable: true`, which GoReleaser documents as also discarding
      # `--release-notes`. The extract step above succeeded, GoReleaser
      # succeeded, and the release page was still blank — nothing in the run
      # failed. This is the assertion that closes that gap: the notes reached
      # the published release, not just the runner's disk.
      - name: Verify the release body is not empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::${GITHUB_REF_NAME} published with an empty body." \
                 "Release notes were extracted but never reached the release page —" \
                 "check that .goreleaser.yaml does not disable the changelog pipe."
            exit 1
          fi
          printf '%s\n' "release body: $(printf '%s' "$body" | wc -c) bytes"

      # The site header shows `git describe`, and docs.yml only fires on a push
      # that touches docs/ or web/. A tag touches neither, so after every release
      # the site kept the previous version until someone remembered to dispatch
      # the workflow by hand — v0.6.0 published with the site still reading
      # v0.5.0. A `paths`-filtered `push` trigger cannot cover this: tagging an
      # existing commit pushes no commits, so no path ever matches.
      #
      # `workflow_dispatch` is one of the two events GitHub documents as still
      # creating a run when sent with GITHUB_TOKEN, so no PAT is needed. The
      # deploy job's own `github.ref == 'refs/heads/main'` guard is satisfied by
      # `--ref main`.
      #
      # A failure here does not un-publish the release, but it is left to fail
      # the job on purpose: a silent no-op is what made this a recurring manual
      # step in the first place.
      - name: Refresh the documentation site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main
