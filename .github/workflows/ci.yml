name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when new commits are pushed to the same ref
# (e.g. rapid pushes to a PR branch). Pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      # `make test` / `make test-race` depend on the `embedded-docs` target,
      # which syncs the gitignored docs tree into internal/core/docs/embedded/
      # so the //go:embed directive compiles.
      - name: Test
        run: make test

      - name: Race tests
        run: make test-race

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      # golangci-lint type-checks the packages, so the generated embedded docs
      # tree must exist before it runs. `make lint` does not depend on it.
      - name: Sync embedded docs
        run: make embedded-docs

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
