version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    # Temporary target; switch to main after the TUI milestone ships.
    target-branch: "tui"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Temporary target; switch to main after the TUI milestone ships.
    target-branch: "tui"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"

  # Docs site (web/, Astro Starlight) is a build-time mirror of docs/ — its npm
  # deps are documentation-only and non-critical. We deliberately do NOT track
  # them: `ignore: "*"` suppresses both version-update AND security-update PRs
  # for the whole /web stack (ignore conditions apply to security updates too).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
