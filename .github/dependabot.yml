version: 2

# Policy (main, post-TUI-milestone):
#   * Serious fixes → Dependabot SECURITY updates. These run independently of
#     the blocks below (they honor repo "Dependabot security updates", always
#     target the default branch, and ignore schedule/limit), so real advisories
#     still open a PR promptly.
#   * Routine bumps → one grouped, MONTHLY digest PR per ecosystem. Low noise:
#     we don't want a PR for every version, just to stay roughly current.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      # Everything (major/minor/patch) collapses into a single monthly PR.
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"

  # Docs site (web/, Astro Starlight) is a build-time mirror of docs/ — its npm
  # deps are documentation-only and non-critical. We deliberately do NOT track
  # them: `ignore: "*"` suppresses both version-update AND security-update PRs
  # for the whole /web stack (ignore conditions apply to security updates too).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
