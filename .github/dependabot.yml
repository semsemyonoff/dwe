version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    # Temporary target; switch to main after the TUI milestone ships.
    target-branch: "tui"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Temporary target; switch to main after the TUI milestone ships.
    target-branch: "tui"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"
