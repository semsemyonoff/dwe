version: 2

# Policy (main, post-TUI-milestone):
#   * Serious fixes → Dependabot SECURITY updates. These run independently of
#     the blocks below (they honor repo "Dependabot security updates", always
#     target the default branch, and ignore schedule/limit), so real advisories
#     still open a PR promptly.
#   * Routine bumps → one grouped, MONTHLY digest PR per ecosystem. Low noise:
#     we don't want a PR for every version, just to stay roughly current.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      # Everything (major/minor/patch) collapses into a single monthly PR.
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"

  # Docs site (web/, Astro Starlight) is a build-time mirror of docs/ — its npm
  # deps are documentation-only (static output to GitHub Pages; nothing here is
  # shipped in the dwe binary). We deliberately keep them quiet on two fronts:
  #   * update PRs — `ignore: "*"` below suppresses Dependabot update PRs
  #     (routine version bumps AND security-fix PRs) for the whole /web stack.
  #   * alerts — `ignore` does NOT silence Dependabot ALERTS; those scan the
  #     dependency graph regardless of this file, and nothing in this file can
  #     turn them off. What this file does contribute is the *scope*: every
  #     web/ dep lives under `devDependencies` (web/package.json), so the graph
  #     classifies them and their transitives (esbuild, vite, …) as
  #     `development` rather than `runtime`.
  #
  #     Acting on that scope is a repo setting, NOT a default — see Settings →
  #     Code security → Dependabot → Auto-triage rules, where a custom rule
  #     (ecosystem `npm` + scope `development` → dismiss) closes them. There is
  #     no REST API for those rules, so they cannot live in this repo; if the
  #     alert list starts filling up with web/ entries again, the rule is gone.
  #     Do not assume GitHub dismisses dev-scoped advisories on its own: it
  #     ships a curated preset that covers only low/medium severity, and it is
  #     opt-in. Eleven web/ alerts — five of them high — sat open under an
  #     earlier version of this comment that claimed otherwise.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
