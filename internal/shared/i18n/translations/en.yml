  # tui help modal (framework ?-modal, generated from the action registry).
  # Section keys are the lowercased Section label; action keys are the Action ID
  # (e.g. nav.up, cmd.skip-confirm). English values mirror the in-code Binding
  # fallbacks so the en modal renders identically with or without a Store. The
  # `select` action is intentionally NOT keyed: its label is mode-dependent
  # ("Select" in run mode, "Edit" in the vars browser) and a single key would
  # flatten that distinction (see internal/core/ui/cmdbrowser/actions.go).
