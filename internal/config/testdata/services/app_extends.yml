services:
  base:
    type: app
    container: app-base
    dir: ./services/base
    dir_internal: /workspace
    work_dir_internal: /workspace/src
    configs:
      - .env
    compose:
      - compose/services/base/base.yml
    ports:
      http: 8080
    hosts:
      main: base.localhost
  child:
    type: app
    container: app-child
    extends: base
