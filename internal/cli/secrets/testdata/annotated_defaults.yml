# Shared project defaults — tracked in git and reviewed like code.
# Values written as ENC[age:...] are encrypted with `dwe secrets`.

vars:
  service_defaults: &service_defaults
    restart: unless-stopped
    pull: missing

  telegram:
    bot_token: placeholder-token
    "chat-id": '42'        # quoted key, quoted value

  app:
    <<: *service_defaults
    name: myapp            # overrides nothing, just annotated
    tags:
      - alpha
      - beta

  notes: |
    first line of the note
    # this stays part of the literal block
    last line of the note

# Trailing note kept at the end of the file.
