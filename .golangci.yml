version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - modernize

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # usercommands.go is a re-export facade; real docs live on the source types.
      - linters:
          - revive
        path: internal/core/usercommands/usercommands\.go
        text: "exported"
      # internal/docs/tui/ widget types are package-internal implementation details.
      # They are exported only because they appear in Model fields; they have no public API.
      - linters:
          - revive
        path: internal/core/docs/tui/
        text: "exported"
      # info_test.go uses ptrBool helper to create bool pointers in test fixtures.
      # ui_test.go uses intPtr helper to create int pointers in test fixtures.
      # The modernize newexpr check suggests simplifying helper(x) to new(x),
      # but new(T) creates a zero-value pointer, not a pointer to the intended value.
      - linters:
          - modernize
        path: internal/core/project/config/(info|ui)_test\.go
        text: "newexpr"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - devbox-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
