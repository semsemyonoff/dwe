version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - modernize

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # usercommands.go is a re-export facade; real docs live on the source types.
      - linters:
          - revive
        path: internal/usercommands/usercommands\.go
        text: "exported"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - devbox-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
