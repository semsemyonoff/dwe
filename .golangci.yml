version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - modernize

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # usercommands.go is a re-export facade; real docs live on the source types.
      - linters:
          - revive
        path: internal/usercommands/usercommands\.go
        text: "exported"
      # info_test.go uses ptrBool helper to create bool pointers in test fixtures.
      # The modernize newexpr check suggests simplifying ptrBool(x) to new(x),
      # but new(bool) creates a false pointer, not the intended value.
      - linters:
          - modernize
        path: internal/config/info_test\.go
        text: "newexpr"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - devbox-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
